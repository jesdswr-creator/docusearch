name: Build DocuSearch

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  QT_VERSION: '6.8.1'
  QT_ARCH: 'win64_msvc2022_64'

jobs:
  build-windows:
    name: Build on Windows Server 2022
    runs-on: windows-2022
    # Need contents:write permission to push the ci-logs branch on failure.
    permissions:
      contents: write
      actions: read
    # Bumped from 120 to 240 minutes because Poppler is a heavy port
    # that takes ~20-30 min to compile from source on first run
    # (subsequent runs hit the vcpkg binary cache and are much faster).
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          Write-Host "=== Available architectures for Qt $env:QT_VERSION ==="
          python -m aqt list-qt windows desktop --arch $env:QT_VERSION
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O C:\Qt
          # Find the Qt installation directory. aqtinstall creates
          # C:\Qt\<version>\<arch>\ but the arch name may vary.
          $msvcRoot = $null
          $qtBase = "C:\Qt\$env:QT_VERSION"
          if (Test-Path $qtBase) {
            # List all subdirectories and find the MSVC one.
            $candidates = Get-ChildItem -Path $qtBase -Directory -ErrorAction SilentlyContinue
            foreach ($dir in $candidates) {
              if ($dir.Name -match 'msvc') {
                $msvcRoot = $dir.FullName
                break
              }
            }
          }
          if (-not $msvcRoot) {
            # Broader search
            $msvcRoot = Get-ChildItem -Path "C:\Qt" -Filter "win64_msvc*" -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $msvcRoot -or -not (Test-Path $msvcRoot)) { throw "Qt MSVC dir not found. Searched: $qtBase and C:\Qt recursively" }
          $qtBin = Join-Path $msvcRoot "bin"
          Write-Host "Qt root: $msvcRoot"
          Get-ChildItem $qtBin -Filter "Qt6*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          Get-ChildItem $qtBin -Filter "windeployqt*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          echo "QtInstallDir=$msvcRoot" >> $env:GITHUB_ENV
          echo "$qtBin" >> $env:GITHUB_PATH

      - name: Set up vcpkg
        shell: pwsh
        run: |
          # Use the vcpkg pre-installed on GitHub-hosted Windows runners
          # (C:\vcpkg). It's already bootstrapped.
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH
          & C:\vcpkg\vcpkg.exe --version

      - name: Cache vcpkg downloads and installed packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Pre-download sqlite3 source (workaround for SSL errors on sqlite.org)
        shell: pwsh
        run: |
          # vcpkg fails to download sqlite3 from sqlite.org due to SSL connect
          # errors (curl error 35) on GitHub Actions runners. vcpkg refuses to
          # retry "non-transient" errors, so the whole build fails.
          #
          # Workaround: pre-download the sqlite3 tarball with curl --retry from
          # multiple mirrors and place it in vcpkg's downloads folder. When vcpkg
          # runs, it will find the file already present and skip the download.
          #
          # This step is BEST-EFFORT: if all mirrors fail, we exit 0 anyway and
          # let the cmake configure retry loop handle it.
          $filename = "sqlite-autoconf-3530200.tar.gz"
          $dest = "C:\vcpkg\downloads\$filename"
          if (Test-Path $dest) {
            $size = (Get-Item $dest).Length
            if ($size -gt 1MB) {
              Write-Host "sqlite3 tarball already present ($size bytes), skipping download"
              exit 0
            }
          }
          $mirrors = @(
            "https://sqlite.org/2026/$filename",
            "https://www.sqlite.org/2026/$filename",
            "https://fossies.org/linux/misc/$filename",
            "https://fossies.org/linux/misc/sqlite-3.53.2.tar.gz"
          )
          $downloaded = $false
          foreach ($url in $mirrors) {
            Write-Host "Attempting download from: $url"
            # Try curl first
            & curl -L --retry 10 --retry-delay 5 --retry-connrefused --connect-timeout 30 --max-time 120 -o $dest $url 2>&1 | Write-Host
            if ($LASTEXITCODE -eq 0 -and (Test-Path $dest)) {
              $size = (Get-Item $dest).Length
              if ($size -gt 1MB) {
                Write-Host "Successfully downloaded from $url via curl ($size bytes)"
                $downloaded = $true
                break
              }
            }
            Remove-Item $dest -ErrorAction SilentlyContinue
            # Try PowerShell Invoke-WebRequest as fallback
            Write-Host "curl failed, trying Invoke-WebRequest from: $url"
            try {
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri $url -OutFile $dest -TimeoutSec 120 -UseBasicParsing
              if (Test-Path $dest) {
                $size = (Get-Item $dest).Length
                if ($size -gt 1MB) {
                  Write-Host "Successfully downloaded from $url via Invoke-WebRequest ($size bytes)"
                  $downloaded = $true
                  break
                }
              }
            } catch {
              Write-Host "Invoke-WebRequest failed: $_"
            }
            Remove-Item $dest -ErrorAction SilentlyContinue
          }
          if (-not $downloaded) {
            Write-Host "WARNING: All mirrors failed. vcpkg will try on its own during cmake configure."
            # Exit 0 so this step doesn't fail the workflow — the cmake
            # configure retry loop will handle the download.
            exit 0
          }
          exit 0

      - name: Install WiX v4 (pinned to avoid v7 OSMF EULA)
        shell: pwsh
        run: |
          # Pin to WiX v4.0.5 — WiX v7 requires accepting the OSMF EULA
          # which fails non-interactively on CI. v4 has no such restriction.
          dotnet tool install -g wix --version 4.0.5
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          # Pre-fetch the UI extension so wix build can resolve it offline
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add WixToolset.UI.wixext/4.0.5
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version

      # NOTE: vcpkg dependencies (sqlite3, poppler, zlib)
      # are installed automatically by CMake via the vcpkg manifest (vcpkg.json)
      # when we configure with -DCMAKE_TOOLCHAIN_FILE=vcpkg.cmake. No need for
      # a separate `vcpkg install` step. Tesseract/Leptonica are REMOVED —
      # OCR is handled by Windows OCR (built into Windows 10/11).

      - name: Configure CMake (this also installs vcpkg deps from vcpkg.json)
        shell: pwsh
        run: |
          # Poppler is ENABLED for PDF text extraction (born-digital PDFs).
          # OCR is handled by Windows OCR (Windows.Media.Ocr via WinRT),
          # which is built into Windows 10/11 — no third-party dependency.
          #
          # CRITICAL: Capture output and check exit code. Previously the
          # configure step could fail silently (e.g. due to a CMakeLists.txt
          # error) and the workflow would continue to the Build step, which
          # then fails with "ALL_BUILD.vcxproj does not exist" because
          # CMake never generated the project files.
          #
          # RETRY: vcpkg downloads can fail with transient SSL errors
          # (curl error 35). Retry the whole cmake configure up to 3 times.
          $maxRetries = 3
          $attempt = 0
          $output = $null
          $exitCode = 1
          while ($attempt -lt $maxRetries) {
            $attempt++
            Write-Host ""
            Write-Host "============================================"
            Write-Host "=== CMake configure attempt $attempt/$maxRetries ==="
            Write-Host "============================================"
            # Clean any partial build dir from a previous failed attempt.
            if (Test-Path build) { Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue }
            $output = & cmake -B build -S . `
              -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
              -DCMAKE_PREFIX_PATH="$env:QtInstallDir" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_MANIFEST_MODE=ON `
              -DDOCUSEARCH_BUILD_TESTS=ON `
              -DDOCUSEARCH_ENABLE_TESSERACT=OFF `
              -DDOCUSEARCH_ENABLE_POPPLER=ON 2>&1
            $exitCode = $LASTEXITCODE
            $output | Out-File -FilePath configure-output.log -Encoding utf8
            if ($exitCode -eq 0 -and (Test-Path "build\ALL_BUILD.vcxproj")) {
              Write-Host "CMake configure succeeded on attempt $attempt"
              break
            }
            Write-Host "CMake configure failed on attempt $attempt (exit code $exitCode)"
            if ($attempt -lt $maxRetries) {
              Write-Host "Waiting 60 seconds before retry..."
              Start-Sleep -Seconds 60
            }
          }
          $output | Write-Host
          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "=== CMAKE CONFIGURE FAILED after $maxRetries attempts (exit code $exitCode) ==="
            Write-Host "=== Last 300 lines of output ==="
            $output | Select-Object -Last 300 | Write-Host
            $summary = "## CMake Configure Failed (exit code $exitCode)`n`n``````" + ($output | Select-Object -Last 300 | Out-String) + "``````"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit $exitCode
          }
          # Verify that ALL_BUILD.vcxproj was actually generated.
          if (-not (Test-Path "build\ALL_BUILD.vcxproj")) {
            Write-Host "=== ERROR: build\ALL_BUILD.vcxproj was not generated! ==="
            Write-Host "=== CMake configure did not error out, but the project file is missing. ==="
            Write-Host "=== Full configure output: ==="
            $output | Write-Host
            exit 1
          }
          Write-Host "=== vcpkg installed packages ==="
          & C:\vcpkg\vcpkg.exe list

      - name: Build (Release)
        shell: pwsh
        run: |
          # Build with --parallel 1 so errors are not interleaved.
          # Always save full output to build-output.log so it can be
          # uploaded as an artifact on failure for offline debugging.
          $output = & cmake --build build --config Release --parallel 1 2>&1
          $output | Out-File -FilePath build-output.log -Encoding utf8
          $output | Write-Host
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "=== BUILD FAILED (exit code $exitCode) ==="
            Write-Host "=== Last 300 lines of output ==="
            $output | Select-Object -Last 300 | Write-Host
            # Also write to GITHUB_STEP_SUMMARY so the error is visible
            # in the check-run summary (no need to expand the step log).
            $summary = "## Build Failed (exit code $exitCode)`n`n``````" + ($output | Select-Object -Last 300 | Out-String) + "``````"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit $exitCode
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-output-log
          path: build-output.log
          if-no-files-found: warn
          retention-days: 30

      - name: Push build log to ci-logs branch on failure
        if: failure()
        shell: pwsh
        run: |
          git config --global user.email "ci@docusearch.local"
          git config --global user.name "CI Bot"
          $sha = ${env:GITHUB_SHA}.Substring(0,7)
          New-Item -ItemType Directory -Force -Path "logs/$sha" | Out-Null
          if (Test-Path build-output.log) {
            Copy-Item build-output.log "logs/$sha/build-output.log" -Force
          }
          if (Test-Path configure-output.log) {
            Copy-Item configure-output.log "logs/$sha/configure-output.log" -Force
          }
          if (-not (Test-Path "logs/$sha/build-output.log") -and -not (Test-Path "logs/$sha/configure-output.log")) {
            Write-Host "No log files found"; exit 0
          }
          git checkout --orphan ci-logs 2>$null
          git rm -r --cached . 2>$null
          git add "logs/$sha/*.log"
          git commit -m "Add build logs for failed run $sha"
          git push origin ci-logs --force 2>&1 | Write-Host

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -C Release
        continue-on-error: true

      - name: Bundle Qt DLLs (windeployqt) + Poppler DLLs
        shell: pwsh
        run: |
          $wdq = Join-Path $env:QtInstallDir "bin\windeployqt.exe"
          & $wdq --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-quick-import --compiler-runtime build\bin\Release\DocuSearch.exe
          # CRITICAL: windeployqt doesn't detect Qt6Sql dependency because
          # QSqlDatabase is loaded dynamically. We must add it manually.
          $qtBin = Join-Path $env:QtInstallDir "bin"
          Copy-Item "$qtBin\Qt6Sql.dll" "build\bin\Release\Qt6Sql.dll" -Force
          # Also ensure the SQLite driver plugin is bundled
          $pluginDir = "build\bin\Release\sqldrivers"
          if (-not (Test-Path $pluginDir)) { New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null }
          Copy-Item "$qtBin\..\plugins\sqldrivers\qsqlite.dll" "$pluginDir\qsqlite.dll" -Force
          # Also copy Qt6Concurrent, Qt6Network, Qt6PrintSupport (used by the app)
          Copy-Item "$qtBin\Qt6Concurrent.dll" "build\bin\Release\Qt6Concurrent.dll" -Force -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\Qt6Network.dll" "build\bin\Release\Qt6Network.dll" -Force -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\Qt6PrintSupport.dll" "build\bin\Release\Qt6PrintSupport.dll" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build\bin\Release\themes | Out-Null
          Copy-Item -Path resources\themes\*.qss -Destination build\bin\Release\themes -Force

          # ---- Bundle non-Qt DLLs: Poppler and its transitive deps.
          # Tesseract/Leptonica are REMOVED — OCR uses Windows OCR.
          # windeployqt only handles Qt DLLs - it doesn't know about
          # vcpkg-installed libraries. We copy them from the vcpkg bin.
          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          if (-not (Test-Path $vcpkgBin)) {
            $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          }
          if (Test-Path $vcpkgBin) {
            Write-Host "=== Copying vcpkg runtime DLLs from $vcpkgBin ==="
            $runtimeDlls = @(
              'poppler-cpp.dll',
              'poppler.dll',
              'openjp2.dll',
              'jpeg62.dll',
              'libjpeg.dll',
              'png16.dll',
              'libpng16.dll',
              'tiff.dll',
              'libtiff.dll',
              'zstd.dll',
              'libzstd.dll',
              'lzma.dll',
              'liblzma.dll',
              'brotlidec.dll',
              'brotlicommon.dll',
              'freetype.dll',
              'fontconfig-1.dll',
              'expat.dll',
              'libexpat.dll',
              'iconv-2.dll',
              'libiconv.dll',
              'charset-1.dll',
              'libcharset.dll',
              'lcms2.dll',
              'liblcms2.dll'
            )
            $copied = 0
            foreach ($dll in $runtimeDlls) {
              $src = Join-Path $vcpkgBin $dll
              if (Test-Path $src) {
                Copy-Item $src "build\bin\Release\$dll" -Force
                $copied++
              }
            }
            Write-Host "Copied $copied runtime DLLs from vcpkg."

            # Fallback: copy every *.dll that mentions poppler, openjp,
            # jpeg, png, tiff, freetype, fontconfig.
            Get-ChildItem -Path $vcpkgBin -Filter "*.dll" | Where-Object {
              $_.Name -match 'poppler|openjp|jpeg|png|tiff|freetype|fontconfig|lcms|zstd|lzma|brotli|expat|iconv|charset'
            } | ForEach-Object {
              $dst = "build\bin\Release\$($_.Name)"
              if (-not (Test-Path $dst)) {
                Copy-Item $_.FullName $dst -Force
                Write-Host "  (fallback) Copied $($_.Name)"
              }
            }
          } else {
            Write-Host "WARNING: vcpkg bin dir not found at $vcpkgBin - Poppler DLLs may be missing."
          }

      - name: Copy OCR helper exe
        shell: pwsh
        continue-on-error: true
        run: |
          # Copy the Windows OCR helper exe to the release folder.
          $helperExe = Get-ChildItem -Path "build" -Filter "docusearch_ocr_helper.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($helperExe) {
            Copy-Item $helperExe.FullName "build\bin\Release\docusearch_ocr_helper.exe" -Force
            Write-Host "Copied docusearch_ocr_helper.exe from $($helperExe.FullName)"
          } else {
            # Try common build output paths
            $paths = @(
              "build\Release\docusearch_ocr_helper.exe",
              "build\Debug\docusearch_ocr_helper.exe",
              "build\bin\Release\docusearch_ocr_helper.exe",
              "build\bin\Debug\docusearch_ocr_helper.exe"
            )
            $found = $false
            foreach ($p in $paths) {
              if (Test-Path $p) {
                Copy-Item $p "build\bin\Release\docusearch_ocr_helper.exe" -Force
                Write-Host "Copied from $p"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: docusearch_ocr_helper.exe not found — OCR will be unavailable"
            }
          }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          # Create a portable ZIP directly from the windeployqt output.
          # This is simpler than MSI/MSIX and works on any Windows 10/11 PC
          # without installation - just unzip and double-click DocuSearch.exe.
          $portableZip = Join-Path (Get-Location) "dist\DocuSearch-1.0.0.0-portable.zip"
          $distDir = Split-Path $portableZip -Parent
          if (-not (Test-Path $distDir)) { New-Item -ItemType Directory -Path $distDir | Out-Null }
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          # Stage files - exclude tst_*.exe test binaries AND
          # vc_redist.x64.exe (24 MB) which windeployqt bundles but
          # is unnecessary because we statically link the VC runtime
          # via /MT. Including it wastes 24 MB in every download.
          $stagingDir = "build\portable-staging"
          if (Test-Path $stagingDir) { Remove-Item $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Get-ChildItem -Path "build\bin\Release" | Where-Object {
              $_.Name -notlike "tst_*" -and
              $_.Name -notlike "vc_redist*" -and
              $_.Name -notlike "vcredist*"
          } | Copy-Item -Destination $stagingDir -Recurse -Force
          # Also remove vc_redist from the main build dir so the MSI
          # harvest doesn't include it either.
          Get-ChildItem -Path "build\bin\Release" -Filter "vc_redist*" | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "build\bin\Release" -Filter "vcredist*" | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $portableZip -CompressionLevel Optimal
          Write-Host "Created portable ZIP: $portableZip"
          Write-Host "Contents:"
          Get-ChildItem $stagingDir | Format-Table Name

      - name: Harvest build output (generate DocuSearch.Harvest.wxs)
        shell: pwsh
        run: |
          # Generate a WiX v4 fragment file enumerating every file in
          # build\bin\Release (Qt DLLs, plugins, themes) so the MSI
          # bundles them. We do this in PowerShell rather than
          # `wix heat dir` because in WiX v4.0.5 heat is not a built-in
          # subcommand of the wix CLI (it requires installing the
          # WixToolset.Heat.wixext extension separately, adding CI flakiness).
          & pwsh -File scripts\generate-harvest.ps1
          if (-not (Test-Path "installer\DocuSearch.Harvest.wxs")) {
            throw "Harvest file was not generated"
          }

      - name: Build MSI installer (WiX v4)
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          $wxsMain = "installer\DocuSearch.wxs"
          $wxsHarvest = "installer\DocuSearch.Harvest.wxs"
          $msiOut = Join-Path (Get-Location) "dist\DocuSearch-Setup-1.0.0.0.msi"
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" | Out-Null }
          # Build MSI: pass both the main wxs and the harvested wxs as inputs.
          # -ext WixToolset.UI.wixext enables <ui:WixUI> for the install wizard.
          # -platform x64 forces 64-bit MSI so it installs to
          # C:\Program Files (not Program Files (x86)).
          & wix build $wxsMain $wxsHarvest -o $msiOut `
            -d "BuildOutputDir=build\bin\Release" `
            -ext WixToolset.UI.wixext `
            -platform x64
          if (-not (Test-Path $msiOut)) { throw "MSI was not produced at $msiOut" }
          Write-Host "=== MSI created: $msiOut ==="
          Get-Item $msiOut | Format-List Name, Length, LastWriteTime

      - name: Upload portable ZIP (the main deliverable)
        uses: actions/upload-artifact@v5
        with:
          name: DocuSearch-portable
          path: dist/DocuSearch-1.0.0.0-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@v5
        with:
          name: DocuSearch-Setup-msi
          path: dist/DocuSearch-Setup-1.0.0.0.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload bare exe folder (debugging)
        uses: actions/upload-artifact@v5
        with:
          name: DocuSearch-bin
          path: build/bin/Release/
          if-no-files-found: warn
          retention-days: 7
